<svg xmlns="http://www.w3.org/2000/svg" width="380" height="880" viewBox="0 0 380 880" role="img" aria-labelledby="title desc">
<title id="title">Budgeted learning and matched controls</title>
<desc id="desc">The same complete budget residual enters rewards and price updates. I/U tests service improvement, I/Y tests per-vehicle update identity, and A/F tests adaptation with matched initial prices.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#687586"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="190" y="29" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#111">Budgeted learning</text>
<rect x="30" y="50" width="320" height="95" rx="7" fill="white" stroke="#d4d8de"/>
<text x="190.0" y="79" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#111">Complete budget residual</text>
<text x="190.0" y="107" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#111">Vehicle shortfall minus</text>
<text x="190.0" y="130" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#111">the reference-scaled budget</text>
<rect x="50" y="175" width="310" height="95" rx="7" fill="white" stroke="#d4d8de"/>
<text x="205.0" y="204" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#111">Training reward</text>
<text x="205.0" y="232" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#111">Use the pre-update price</text>
<text x="205.0" y="255" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#111">and the vehicle’s own residual</text>
<rect x="50" y="290" width="310" height="95" rx="7" fill="white" stroke="#d4d8de"/>
<text x="205.0" y="319" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#111">Price update</text>
<text x="205.0" y="347" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#111">Use the same residual</text>
<text x="205.0" y="370" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#111">to update the price</text>
<polyline points="190,145 190,175" fill="none" stroke="#687586" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="30,98 14,98 14,337 50,337" fill="none" stroke="#687586" stroke-width="2" marker-end="url(#arrow)"/>
<text x="190" y="423" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#111">Three matched comparisons</text>
<rect x="30" y="440" width="320" height="130" rx="7" fill="#f5f5f5" stroke="#d4d8de"/>
<text x="190.0" y="469" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#111">I vs. U</text>
<text x="190.0" y="497" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#111">Service improvement</text>
<text x="190.0" y="520" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#111">Pricing versus</text>
<text x="190.0" y="543" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#111">no pricing</text>
<rect x="30" y="580" width="320" height="130" rx="7" fill="#f5f5f5" stroke="#d4d8de"/>
<text x="190.0" y="609" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#111">I vs. Y</text>
<text x="190.0" y="637" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#111">Update identity</text>
<text x="190.0" y="660" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#111">Intact versus shuffled</text>
<text x="190.0" y="683" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#111">price-update residuals</text>
<rect x="30" y="720" width="320" height="130" rx="7" fill="#f5f5f5" stroke="#d4d8de"/>
<text x="190.0" y="749" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#111">A vs. F</text>
<text x="190.0" y="777" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#111">Price adaptation</text>
<text x="190.0" y="800" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#111">Adaptive versus frozen</text>
<text x="190.0" y="823" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#111">Same initial price: 0.486</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="380" height="930" viewBox="0 0 380 930" role="img" aria-labelledby="title desc">
<title id="title">Testing the multiplier feedback loop</title>
<desc id="desc">Constraint errors update multipliers, which price costs in training rewards and affect MAPPO policy updates. Updated policies change rates and the next error. Cut freezes the multiplier. Misdirect preserves multiplier trajectories but breaks agent targeting. Reverse flips the dual-step sign while retaining the signal and targeting. These are training interventions, not additional inputs to a deployed policy.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#687586"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="190.0" y="31" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#000">Test the feedback loop</text>
<rect x="20" y="50" width="340" height="88" rx="7" fill="#fff" stroke="#d4d8de"/>
<text x="190.0" y="79" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#000">Constraint error</text>
<text x="190.0" y="108" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#000">Service-constraint</text>
<text x="190.0" y="132" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#000">error signal</text>
<polyline points="190,138 190,150" fill="none" stroke="#687586" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="150" width="340" height="88" rx="7" fill="#fff" stroke="#d4d8de"/>
<text x="190.0" y="179" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#000">Multiplier λ</text>
<text x="190.0" y="208" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#000">Update the price</text>
<text x="190.0" y="232" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#000">from the error</text>
<polyline points="190,238 190,250" fill="none" stroke="#687586" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="250" width="340" height="88" rx="7" fill="#fff" stroke="#d4d8de"/>
<text x="190.0" y="279" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#000">Training reward</text>
<text x="190.0" y="308" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#000">Price the</text>
<text x="190.0" y="332" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#000">constraint cost</text>
<polyline points="190,338 190,350" fill="none" stroke="#687586" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="350" width="340" height="88" rx="7" fill="#fff" stroke="#d4d8de"/>
<text x="190.0" y="379" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#000">Policy update</text>
<text x="190.0" y="408" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#000">Train the</text>
<text x="190.0" y="432" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#000">MAPPO agents</text>
<polyline points="20,394 6,394 6,94 20,94" fill="none" stroke="#687586" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="190" y="473" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#000">Updated policies change rates</text>
<text x="190" y="498" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#000">and the next constraint error.</text>
<rect x="20" y="540" width="340" height="116" rx="7" fill="#f5f5f5" stroke="#d4d8de"/>
<text x="190.0" y="569" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#000">Cut</text>
<text x="190.0" y="598" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#000">Freeze the multiplier.</text>
<text x="190.0" y="622" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#000">Remove error-driven</text>
<text x="190.0" y="646" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#000">updates.</text>
<rect x="20" y="668" width="340" height="116" rx="7" fill="#f5f5f5" stroke="#d4d8de"/>
<text x="190.0" y="697" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#000">Misdirect</text>
<text x="190.0" y="726" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#000">Keep multiplier</text>
<text x="190.0" y="750" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#000">trajectories; break</text>
<text x="190.0" y="774" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#000">agent targeting.</text>
<rect x="20" y="796" width="340" height="116" rx="7" fill="#f5f5f5" stroke="#d4d8de"/>
<text x="190.0" y="825" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#000">Reverse</text>
<text x="190.0" y="854" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#000">Flip the dual-step sign.</text>
<text x="190.0" y="878" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#000">Keep the signal and</text>
<text x="190.0" y="902" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#000">agent targeting.</text>
</svg>

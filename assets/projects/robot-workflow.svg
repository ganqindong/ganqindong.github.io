<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="title desc"><title id="title">Visual and geometric feature fusion</title><desc id="desc">Pretrained EfficientNetV2 supplies 1,280 camera features. A boundary-vector layer supplies 400 geometric features. Concatenation and normalization feed a trained fusion encoder, yielding a 400-dimensional input for the place-cell model.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#8998a2"/></marker></defs><rect width="900" height="320" fill="#fff"/><text x="450" y="30" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="600" fill="#000">Camera appearance + LiDAR geometry</text><rect x="18" y="64" width="142" height="80" rx="5" fill="#f3f7f9" stroke="#2f5d78" stroke-width="1.2"/><text x="89.0" y="95" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#000">Camera images</text><text x="89.0" y="121" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#000">224 × 224 pixels</text><rect x="192" y="64" width="196" height="80" rx="5" fill="#f3f7f9" stroke="#2f5d78" stroke-width="1.2"/><text x="290.0" y="90" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#000">EfficientNetV2</text><text x="290.0" y="112" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#000">Pretrained weights</text><text x="290.0" y="132" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#000">1,280 visual features</text><rect x="18" y="180" width="142" height="80" rx="5" fill="#fafbfb" stroke="#a0adb5" stroke-width="1.2"/><text x="89.0" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#000">LiDAR ranges</text><text x="89.0" y="237" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#000">Boundary geometry</text><rect x="192" y="180" width="196" height="80" rx="5" fill="#fafbfb" stroke="#a0adb5" stroke-width="1.2"/><text x="290.0" y="211" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#000">Boundary-vector layer</text><text x="290.0" y="237" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#000">400 geometric features</text><rect x="454" y="112" width="226" height="106" rx="5" fill="#f3f7f9" stroke="#2f5d78" stroke-width="1.2"/><text x="567.0" y="139" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#000">Concatenate + normalize</text><text x="567.0" y="168" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#000">Trained fusion encoder</text><text x="567.0" y="195" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#000">400-dimensional output</text><rect x="722" y="126" width="160" height="78" rx="5" fill="#fafbfb" stroke="#a0adb5" stroke-width="1.2"/><text x="802.0" y="157" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#000">Place-cell model</text><text x="802.0" y="182" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#000">Spatial responses</text><path d="M160,104 H184" fill="none" stroke="#8998a2" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M160,220 H184" fill="none" stroke="#8998a2" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M388,104 H424 V220 H388" fill="none" stroke="#8998a2" stroke-width="1.8"/><path d="M424,165 H446" fill="none" stroke="#8998a2" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M680,165 H714" fill="none" stroke="#8998a2" stroke-width="1.8" marker-end="url(#arrow)"/><text x="450" y="303" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#000">Visual feature extraction and learned fusion extend the existing spatial model.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="380" height="735" viewBox="0 0 380 735" role="img" aria-labelledby="title desc">
<title id="title">Thermal-guided RGB attention workflow</title>
<desc id="desc">Normalized thermal-intensity differences and spatial distances form a prior for attention between RGB features. Four feature scales feed a decoder and nine-class semantic prediction.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#687586"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<polyline points="95,115 95,160" fill="none" stroke="#687586" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="285,115 285,160" fill="none" stroke="#687586" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="95,270 95,300 135,300 135,330" fill="none" stroke="#687586" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="285,270 285,300 245,300 245,330" fill="none" stroke="#687586" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="190,430 190,485" fill="none" stroke="#687586" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="190,565 190,635" fill="none" stroke="#687586" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="10" y="25" width="170" height="90" rx="8" fill="#e8f0ff" stroke="#d8dce3"/>
<text x="95.0" y="54" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#000">RGB input</text>
<text x="95.0" y="82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#000">Visible appearance</text>
<rect x="200" y="25" width="170" height="90" rx="8" fill="#fff0e8" stroke="#d8dce3"/>
<text x="285.0" y="54" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#000">Thermal input</text>
<text x="285.0" y="82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#000">Normalized intensity</text>
<rect x="10" y="160" width="170" height="110" rx="8" fill="#e8f0ff" stroke="#d8dce3"/>
<text x="95.0" y="190" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#000">RGB features</text>
<text x="95.0" y="218" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#000">Queries, keys,</text>
<text x="95.0" y="244" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#000">values</text>
<rect x="200" y="160" width="170" height="110" rx="8" fill="#fff0e8" stroke="#d8dce3"/>
<text x="285.0" y="190" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#000">Attention prior</text>
<text x="285.0" y="218" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#000">Thermal differences</text>
<text x="285.0" y="244" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#000">+ spatial distances</text>
<rect x="40" y="330" width="300" height="100" rx="8" fill="#e6f5f1" stroke="#d8dce3"/>
<text x="190.0" y="360" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#000">Guided attention</text>
<text x="190.0" y="388" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#000">RGB attention + thermal prior</text>
<rect x="40" y="485" width="300" height="80" rx="8" fill="#f1f1f7" stroke="#d8dce3"/>
<text x="190.0" y="514" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#000">MLP decoder</text>
<text x="190.0" y="542" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#000">4 feature scales</text>
<rect x="40" y="635" width="300" height="80" rx="8" fill="#f1f1f7" stroke="#d8dce3"/>
<text x="190.0" y="664" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#000">Prediction</text>
<text x="190.0" y="692" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#000">9 semantic classes</text>
</svg>

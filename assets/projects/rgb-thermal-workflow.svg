<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 285" role="img" aria-labelledby="title desc">
<title id="title">RGB-thermal semantic segmentation</title><desc id="desc">Visible-light and thermal images are processed by an adapted DFormerV2 model with multimodal fusion to produce pixel-wise class predictions.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#88959f"/></marker></defs>
<rect width="900" height="285" rx="0" fill="#ffffff"/>
<text x="35" y="42" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#26292b">RGB-thermal semantic segmentation</text>
<rect x="35" y="75" width="250" height="80" rx="0" fill="#ffffff" stroke="#bcc4c9"/>
<text x="160" y="107" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#2f5d78">RGB + thermal images</text>
<text x="160" y="134" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#687078">Complementary visual inputs</text>
<path d="M292,115 H315" fill="none" stroke="#88959f" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="325" y="75" width="250" height="80" rx="0" fill="#ffffff" stroke="#bcc4c9"/>
<text x="450" y="107" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#2f5d78">Multimodal model</text>
<text x="450" y="134" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#687078">DFormerV2 adaptation + fusion</text>
<path d="M582,115 H605" fill="none" stroke="#88959f" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="615" y="75" width="250" height="80" rx="0" fill="#ffffff" stroke="#bcc4c9"/>
<text x="740" y="107" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#2f5d78">Semantic predictions</text>
<text x="740" y="134" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#687078">A class label for each pixel</text>
<text x="35" y="230" font-family="Arial,sans-serif" font-size="17" fill="#687078">Method schematic for the SERES internship project.</text>
</svg>
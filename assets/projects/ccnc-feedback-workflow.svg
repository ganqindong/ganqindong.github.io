<svg xmlns="http://www.w3.org/2000/svg" width="776" height="480" viewBox="0 0 776 480" role="img" aria-labelledby="title desc">
<title id="title">Budgeted learning and matched controls</title>
<desc id="desc">The same complete budget residual enters rewards and price updates. I/U tests service improvement, I/Y tests per-vehicle update identity, and A/F tests adaptation with matched initial prices.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#687586"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="388" y="29" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#111">Budgeted learning and matched controls</text>
<rect x="170" y="50" width="436" height="95" rx="7" fill="white" stroke="#d4d8de"/>
<text x="388.0" y="79" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#111">Complete budget residual</text>
<text x="388.0" y="107" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#111">Vehicle shortfall minus</text>
<text x="388.0" y="130" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#111">the reference-scaled budget</text>
<rect x="16" y="175" width="360" height="95" rx="7" fill="white" stroke="#d4d8de"/>
<text x="196.0" y="204" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#111">Training reward</text>
<text x="196.0" y="232" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#111">Use the pre-update price</text>
<text x="196.0" y="255" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#111">and the vehicle’s own residual</text>
<rect x="400" y="175" width="360" height="95" rx="7" fill="white" stroke="#d4d8de"/>
<text x="580.0" y="204" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#111">Price update</text>
<text x="580.0" y="232" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#111">Use the same residual</text>
<text x="580.0" y="255" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#111">to update the price</text>
<polyline points="280,145 280,160 196,160 196,175" fill="none" stroke="#687586" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="496,145 496,160 580,160 580,175" fill="none" stroke="#687586" stroke-width="2" marker-end="url(#arrow)"/>
<text x="388" y="306" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#111">Three matched comparisons</text>
<rect x="16" y="325" width="232" height="135" rx="7" fill="#f5f5f5" stroke="#d4d8de"/>
<text x="132.0" y="354" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#111">I vs. U</text>
<text x="132.0" y="382" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#111">Service improvement</text>
<text x="132.0" y="405" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#111">Pricing versus</text>
<text x="132.0" y="428" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#111">no pricing</text>
<rect x="272" y="325" width="232" height="135" rx="7" fill="#f5f5f5" stroke="#d4d8de"/>
<text x="388.0" y="354" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#111">I vs. Y</text>
<text x="388.0" y="382" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#111">Update identity</text>
<text x="388.0" y="405" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#111">Intact versus shuffled</text>
<text x="388.0" y="428" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#111">price-update residuals</text>
<rect x="528" y="325" width="232" height="135" rx="7" fill="#f5f5f5" stroke="#d4d8de"/>
<text x="644.0" y="354" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#111">A vs. F</text>
<text x="644.0" y="382" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#111">Price adaptation</text>
<text x="644.0" y="405" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#111">Adaptive versus frozen</text>
<text x="644.0" y="428" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#111">Same initial price: 0.486</text>
</svg>

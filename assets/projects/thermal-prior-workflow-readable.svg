<rect x="260" y="175" width="210" height="105" rx="8" fill="#fff0e8" stroke="#d8dce3"/>
<text x="365.0" y="205" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#000">Attention prior</text>
<text x="365.0" y="233" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#000">Thermal differences</text>
<text x="365.0" y="259" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#000">+ spatial distances</text>
<rect x="535" y="90" width="210" height="160" rx="8" fill="#e6f5f1" stroke="#d8dce3"/>
<text x="640.0" y="120" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#000">Guided attention</text>
<text x="640.0" y="148" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#000">RGB attention</text>
<text x="640.0" y="174" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#000">+ thermal prior</text>
<rect x="260" y="335" width="210" height="80" rx="8" fill="#f1f1f7" stroke="#d8dce3"/>

<text x="365.0" y="392" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#000">4 feature scales</text>
<rect x="535" y="335" width="210" height="80" rx="8" fill="#f1f1f7" stroke="#d8dce3"/>
<text x="640.0" y="364" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#000">Prediction</text>
<text x="640.0" y="392" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#000">9 semantic classes</text>

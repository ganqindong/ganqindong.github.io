<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 550" role="img" aria-labelledby="title desc"><title id="title">Visual and geometric feature fusion</title><desc id="desc">Pretrained EfficientNetV2 supplies 1,280 camera features. A boundary-vector layer supplies 400 geometric features. Concatenation and normalization feed a trained fusion encoder, yielding a 400-dimensional input for the place-cell model.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#8998a2"/></marker></defs><rect width="430" height="550" fill="#fff"/><text x="215" y="28" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="600" fill="#000">Camera + LiDAR fusion</text><rect x="15" y="54" width="190" height="74" rx="5" fill="#f3f7f9" stroke="#2f5d78" stroke-width="1.2"/><text x="110.0" y="84" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="600" fill="#000">Camera images</text><text x="110.0" y="110" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#000">224 × 224 pixels</text><rect x="225" y="54" width="190" height="74" rx="5" fill="#fafbfb" stroke="#a0adb5" stroke-width="1.2"/><text x="320.0" y="84" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="600" fill="#000">LiDAR ranges</text><text x="320.0" y="110" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#000">Boundary geometry</text><path d="M110,128 V148" fill="none" stroke="#8998a2" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M320,128 V148" fill="none" stroke="#8998a2" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="15" y="155" width="190" height="94" rx="5" fill="#f3f7f9" stroke="#2f5d78" stroke-width="1.2"/><text x="110.0" y="184" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="600" fill="#000">EfficientNetV2</text><text x="110.0" y="209" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#000">Pretrained</text><text x="110.0" y="233" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#000">1,280 visual features</text><rect x="225" y="155" width="190" height="94" rx="5" fill="#fafbfb" stroke="#a0adb5" stroke-width="1.2"/><text x="320.0" y="187" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#000">Boundary-vector layer</text><text x="320.0" y="215" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#000">400 geometric features</text><path d="M110,249 V275 H320 V249 M215,275 V294" fill="none" stroke="#8998a2" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="70" y="302" width="290" height="106" rx="5" fill="#f3f7f9" stroke="#2f5d78" stroke-width="1.2"/><text x="215.0" y="329" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#000">Concatenate + normalize</text><text x="215.0" y="359" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#000">Trained fusion encoder</text><text x="215.0" y="387" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#000">400-dimensional output</text><path d="M215,408 V430" fill="none" stroke="#8998a2" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="70" y="437" width="290" height="76" rx="5" fill="#fafbfb" stroke="#a0adb5" stroke-width="1.2"/><text x="215.0" y="468" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#000">Place-cell model</text><text x="215.0" y="494" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#000">Spatial responses</text><text x="215" y="540" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#000">Visual appearance augments geometry.</text></svg>
